# ═══════════════════════════════════════════════════════════════
# Morgana（蜃楼）系统配置文件
# 使用 KEY=VALUE 格式，修改后重启系统生效
# 注意：值中不要使用引号，等号两侧不要有空格
# 适用于：Windows (Git Bash/MSYS2) / Linux / macOS
# ═══════════════════════════════════════════════════════════════

# ─── 数据库（Database）─────────────────────────────────────────
# 支持 MariaDB / MySQL / 云数据库
DB_HOST=localhost
DB_PORT=3306
DB_DATABASE=morgana
DB_USER=root
DB_PASSWORD=

# ─── 后端（Backend Server）─────────────────────────────────────
SERVER_PORT=3001

# ─── 前端（Frontend）───────────────────────────────────────────
FRONTEND_PORT=5173

# ─── 页面服务（Pages Server）────────────────────────────────────
# Hermes Agent 搭建 HTTP 服务所用的根路径和端口
PAGES_ROOT=D:\hermes-pages
PAGES_PORT=3002